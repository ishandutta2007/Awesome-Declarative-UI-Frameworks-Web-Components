<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1200 400"><defs><linearGradient id="bgGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#090d16"/><stop offset="50%" stop-color="#0f172a"/><stop offset="100%" stop-color="#030712"/></linearGradient><linearGradient id="primaryGlow" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#38bdf8"/><stop offset="50%" stop-color="#818cf8"/><stop offset="100%" stop-color="#c084fc"/></linearGradient><linearGradient id="badgeGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#1e293b" stop-opacity=".8"/><stop offset="100%" stop-color="#0f172a" stop-opacity=".9"/></linearGradient><radialGradient id="radialCyan" cx="20%" cy="30%" r="50%"><stop offset="0%" stop-color="#06b6d4" stop-opacity=".25"/><stop offset="100%" stop-color="#06b6d4" stop-opacity="0"/></radialGradient><radialGradient id="radialPurple" cx="80%" cy="70%" r="55%"><stop offset="0%" stop-color="#8b5cf6" stop-opacity=".28"/><stop offset="100%" stop-color="#8b5cf6" stop-opacity="0"/></radialGradient><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path fill="none" stroke="#334155" stroke-opacity=".3" stroke-width=".75" d="M 40 0 L 0 0 0 40"/></pattern><style>@keyframes floatSlow{0%{transform:translateY(0) rotate(0deg)}50%{transform:translateY(-12px) rotate(1.5deg)}}@keyframes floatReverse{0%{transform:translateY(0) rotate(0deg)}50%{transform:translateY(10px) rotate(-1.5deg)}}@keyframes pulseGlow{0%{opacity:.35;transform:scale(1)}50%{opacity:.65;transform:scale(1.08)}}@keyframes orbitCard{0%{transform:translate(0,0)}50%{transform:translate(8px,-6px)}}.subtitle-text,.title-text{font-family:-apple-system,BlinkMacSystemFont,&apos;Segoe UI&apos;,Roboto,Helvetica,Arial,sans-serif}.title-text{font-weight:800;font-size:46px;fill:#f8fafc;letter-spacing:-1px}.subtitle-text{font-weight:500;font-size:20px;fill:#94a3b8}.pill-text{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;font-size:13px;font-weight:600;fill:#38bdf8}.accent-text{fill:url(#primaryGlow)}.floating-node-1{animation:floatSlow 7s ease-in-out infinite;transform-origin:center}.floating-node-2,.pulsing-orb{animation:floatReverse 8s ease-in-out infinite;transform-origin:center}.pulsing-orb{animation:pulseGlow 5s ease-in-out infinite}.animated-stream{stroke-dasharray:8,8;animation:dashMove 4s linear infinite}</style></defs><rect width="100%" height="100%" fill="url(#bgGrad)"/><circle cx="180" cy="120" r="180" fill="url(#radialCyan)" class="pulsing-orb"/><circle cx="1020" cy="280" r="220" fill="url(#radialPurple)" class="pulsing-orb"/><rect width="100%" height="100%" fill="url(#grid)"/><g opacity=".35"><path fill="none" stroke="#38bdf8" stroke-width="2" d="M 50 80 Q 300 20 600 80 T 1150 80" class="animated-stream"/><path fill="none" stroke="#a855f7" stroke-width="2" d="M 50 320 Q 400 380 700 320 T 1150 320" class="animated-stream"/></g><g class="floating-node-1" opacity=".85"><g transform="translate(60, 48)"><rect width="180" height="36" fill="url(#badgeGrad)" stroke="#38bdf8" stroke-width="1.2" rx="18"/><circle cx="20" cy="18" r="5" fill="#38bdf8"/><text x="35" y="23" fill="#e2e8f0" class="pill-text">&lt;custom-element&gt;</text></g><g transform="translate(80, 310)"><rect width="160" height="34" fill="url(#badgeGrad)" stroke="#818cf8" stroke-width="1.2" rx="17"/><circle cx="18" cy="17" r="5" fill="#818cf8"/><text x="32" y="22" fill="#c7d2fe" class="pill-text">Shadow DOM v1</text></g></g><g class="floating-node-2" opacity=".85"><g transform="translate(960, 52)"><rect width="180" height="36" fill="url(#badgeGrad)" stroke="#c084fc" stroke-width="1.2" rx="18"/><circle cx="20" cy="18" r="5" fill="#c084fc"/><text x="35" y="23" fill="#f3e8ff" class="pill-text">Declarative UI</text></g><g transform="translate(940, 312)"><rect width="200" height="34" fill="url(#badgeGrad)" stroke="#38bdf8" stroke-width="1.2" rx="17"/><circle cx="18" cy="17" r="5" fill="#38bdf8"/><text x="32" y="22" fill="#bae6fd" class="pill-text">Design Systems &amp; CI</text></g></g><g id="foreground-content"><g transform="translate(450, 68)"><rect width="300" height="32" fill="#1e293b" fill-opacity=".9" stroke="url(#primaryGlow)" stroke-width="1.5" rx="16"/><text x="150" y="21" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" letter-spacing="1.5" text-anchor="middle">⚡ AWESOME CURATED ECOSYSTEM</text></g><text x="600" y="165" class="title-text" text-anchor="middle">Awesome <tspan class="accent-text">Declarative UI</tspan> &amp; <tspan fill="#38bdf8">Web Components</tspan></text><text x="600" y="215" class="subtitle-text" text-anchor="middle">Standards-Based Custom Elements • Design Systems • Component Workshops • Enterprise SaaS</text><g><g transform="translate(240, 255) translate(0, 0)"><rect width="165" height="32" fill="#1e293b" stroke="#334155" stroke-width="1" rx="8"/><text x="82" y="20" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" text-anchor="middle">🧩 Framework Agnostic</text></g><g transform="translate(240, 255) translate(180, 0)"><rect width="180" height="32" fill="#1e293b" stroke="#334155" stroke-width="1" rx="8"/><text x="90" y="20" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" text-anchor="middle">📸 Visual Regression</text></g><g transform="translate(240, 255) translate(375, 0)"><rect width="165" height="32" fill="#1e293b" stroke="#334155" stroke-width="1" rx="8"/><text x="82" y="20" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" text-anchor="middle">♿ Accessible Primitives</text></g><g transform="translate(240, 255) translate(555, 0)"><rect width="165" height="32" fill="#1e293b" stroke="#334155" stroke-width="1" rx="8"/