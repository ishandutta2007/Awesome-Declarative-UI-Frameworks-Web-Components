<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="primaryGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>

    <radialGradient id="radialCyan" cx="20%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="radialPurple" cx="80%" cy="70%" r="55%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.28" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0" />
    </radialGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.75" stroke-opacity="0.3" />
    </pattern>

    <style>
      .title-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 800;
        font-size: 46px;
        fill: #f8fafc;
        letter-spacing: -1px;
      }
      .subtitle-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 500;
        font-size: 20px;
        fill: #94a3b8;
      }
      .pill-text {
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        font-size: 13px;
        font-weight: 600;
        fill: #38bdf8;
      }
      .accent-text {
        fill: url(#primaryGlow);
      }

      /* Animated dynamic aspects */
      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-12px) rotate(1.5deg); }
      }
      @keyframes floatReverse {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(10px) rotate(-1.5deg); }
      }
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.35; transform: scale(1); }
        50% { opacity: 0.65; transform: scale(1.08); }
      }
      @keyframes dashMove {
        to { stroke-dashoffset: -80; }
      }
      @keyframes orbitCard {
        0% { transform: translate(0, 0); }
        50% { transform: translate(8px, -6px); }
        100% { transform: translate(0, 0); }
      }

      .floating-node-1 {
        animation: floatSlow 7s ease-in-out infinite;
        transform-origin: center;
      }
      .floating-node-2 {
        animation: floatReverse 8s ease-in-out infinite;
        transform-origin: center;
      }
      .pulsing-orb {
        animation: pulseGlow 5s ease-in-out infinite;
        transform-origin: center;
      }
      .animated-stream {
        stroke-dasharray: 8, 8;
        animation: dashMove 4s linear infinite;
      }
      .orbit-pill {
        animation: orbitCard 6s ease-in-out infinite;
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="100%" height="100%" fill="url(#bgGrad)" />

  <!-- Animated Glowing Ambient Orbs (Background layer) -->
  <circle class="pulsing-orb" cx="180" cy="120" r="180" fill="url(#radialCyan)" />
  <circle class="pulsing-orb" cx="1020" cy="280" r="220" fill="url(#radialPurple)" />

  <!-- Subtle Matrix/Grid Overlay -->
  <rect width="100%" height="100%" fill="url(#grid)" />

  <!-- Dynamic Animated Graphic Lines / Circuit Streams in Background -->
  <g opacity="0.35">
    <path class="animated-stream" d="M 50 80 Q 300 20 600 80 T 1150 80" fill="none" stroke="#38bdf8" stroke-width="2" />
    <path class="animated-stream" d="M 50 320 Q 400 380 700 320 T 1150 320" fill="none" stroke="#a855f7" stroke-width="2" />
  </g>

  <!-- Dynamic Floating Decorative Tech Badges (Non-obstructing, positioned on flanks) -->
  <g class="floating-node-1" opacity="0.85">
    <!-- Left Pill: W3C Web Components -->
    <g transform="translate(60, 48)">
      <rect width="180" height="36" rx="18" fill="url(#badgeGrad)" stroke="#38bdf8" stroke-width="1.2" />
      <circle cx="20" cy="18" r="5" fill="#38bdf8" />
      <text x="35" y="23" class="pill-text" fill="#e2e8f0">&lt;custom-element&gt;</text>
    </g>
    <!-- Left Lower Pill: Shadow DOM -->
    <g transform="translate(80, 310)">
      <rect width="160" height="34" rx="17" fill="url(#badgeGrad)" stroke="#818cf8" stroke-width="1.2" />
      <circle cx="18" cy="17" r="5" fill="#818cf8" />
      <text x="32" y="22" class="pill-text" fill="#c7d2fe">Shadow DOM v1</text>
    </g>
  </g>

  <g class="floating-node-2" opacity="0.85">
    <!-- Right Upper Pill: Declarative Reactivity -->
    <g transform="translate(960, 52)">
      <rect width="180" height="36" rx="18" fill="url(#badgeGrad)" stroke="#c084fc" stroke-width="1.2" />
      <circle cx="20" cy="18" r="5" fill="#c084fc" />
      <text x="35" y="23" class="pill-text" fill="#f3e8ff">Declarative UI</text>
    </g>
    <!-- Right Lower Pill: Design Systems -->
    <g transform="translate(940, 312)">
      <rect width="200" height="34" rx="17" fill="url(#badgeGrad)" stroke="#38bdf8" stroke-width="1.2" />
      <circle cx="18" cy="17" r="5" fill="#38bdf8" />
      <text x="32" y="22" class="pill-text" fill="#bae6fd">Design Systems &amp; CI</text>
    </g>
  </g>

  <!-- FOREGROUND: Core Title, Subtitle, Category Pills (Guaranteed Unobscured) -->
  <g id="foreground-content">
    <!-- Category Mini-Badge -->
    <g transform="translate(450, 68)">
      <rect width="300" height="32" rx="16" fill="#1e293b" fill-opacity="0.9" stroke="url(#primaryGlow)" stroke-width="1.5" />
      <text x="150" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#38bdf8" text-anchor="middle" letter-spacing="1.5">⚡ AWESOME CURATED ECOSYSTEM</text>
    </g>

    <!-- Main Title -->
    <text x="600" y="165" class="title-text" text-anchor="middle">
      Awesome <tspan class="accent-text">Declarative UI</tspan> &amp; <tspan fill="#38bdf8">Web Components</tspan>
    </text>

    <!-- Subtitle -->
    <text x="600" y="215" class="subtitle-text" text-anchor="middle">
      Standards-Based Custom Elements • Design Systems • Component Workshops • Enterprise SaaS
    </text>

    <!-- Interactive Ecosystem Indicators -->
    <g transform="translate(240, 255)">
      <!-- Framework-Agnostic Tag -->
      <g transform="translate(0, 0)">
        <rect width="165" height="32" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
        <text x="82" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#cbd5e1" text-anchor="middle">🧩 Framework Agnostic</text>
      </g>
      <!-- Visual Regression Tag -->
      <g transform="translate(180, 0)">
        <rect width="180" height="32" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
        <text x="90" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#cbd5e1" text-anchor="middle">📸 Visual Regression</text>
      </g>
      <!-- Accessible Primitives Tag -->
      <g transform="translate(375, 0)">
        <rect width="165" height="32" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
        <text x="82" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#cbd5e1" text-anchor="middle">♿ Accessible Primitives</text>
      </g>
      <!-- Enterprise Scale Tag -->
      <g transform="translate(555, 0)">
        <rect width="165" height="32" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
        <text x="82" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#cbd5e1" text-anchor="middle">🚀 Production Proven</text>
      </g>
    </g>
  </g>
</svg>
